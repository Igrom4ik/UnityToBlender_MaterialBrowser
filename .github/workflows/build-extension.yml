name: Verify Blender release archives

on:
  push:
    branches: [main]
    tags: ["max-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/verify_release_archives.py
      - uses: actions/upload-artifact@v4
        with:
          name: blender-material-tools-windows-x64
          path: |
            dist/unity_material_drop-0.5.3-windows-x64.zip
            dist/unity_material_browser-0.13.3-windows-x64.zip
            dist/SHA256SUMS

  legacy-max-release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'max-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build legacy 3ds Max package
        run: python tools/build_max_plugin.py --output-dir legacy-max-dist --expected-version "${GITHUB_REF_NAME#max-v}"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            legacy-max-dist/*.mzp
            legacy-max-dist/*.zip
          generate_release_notes: true
